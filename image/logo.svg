<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Left Leg: Deep Indigo to Bright Cyan -->
    <linearGradient id="gradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    
    <!-- Right Leg: Deep Purple to Indigo -->
    <linearGradient id="gradRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    
    <!-- Left Crossbar: Purple to Cyan -->
    <linearGradient id="gradCrossL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    
    <!-- Right Crossbar: Cyan to Indigo -->
    <linearGradient id="gradCrossR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Left Main Ribbon -->
  <polygon points="256,32 176,32 48,256 176,480 256,480 144,256" fill="url(#gradLeft)"/>
  
  <!-- Right Main Ribbon -->
  <polygon points="256,32 336,32 464,256 336,480 256,480 368,256" fill="url(#gradRight)"/>
  
  <!-- Left Inner Crossbar (Chevron Left) -->
  <polygon points="144,256 256,200 256,280 176,320" fill="url(#gradCrossL)"/>
  
  <!-- Right Inner Crossbar (Chevron Right) -->
  <polygon points="256,200 368,256 336,320 256,280" fill="url(#gradCrossR)"/>
  
  <!-- Center Glowing Peak (Diamond Highlight) -->
  <polygon points="256,200 312,228 256,280 200,228" fill="#38bdf8" opacity="0.65"/>
  
  <!-- Precision Bevel Highlights (For Minimal Luxury Glass/3D feel) -->
  <polyline points="256,32 256,200" stroke="#ffffff" stroke-width="2.5" opacity="0.35" fill="none" stroke-linecap="round"/>
  <polyline points="256,280 256,480" stroke="#ffffff" stroke-width="1.5" opacity="0.15" fill="none" stroke-linecap="round"/>
  <polyline points="144,256 256,200 368,256" stroke="#ffffff" stroke-width="2.5" opacity="0.5" fill="none" stroke-linejoin="round"/>
</svg>
